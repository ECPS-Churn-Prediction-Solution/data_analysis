# S3 피처 파일에 반드시 들어있는 컬럼
required:
  - user_id: int64
  - age: int16
  - gender: category # {MALE,FEMALE} 외 값은 null 처리
  - tenure_days: int32
  - recency_score: int8
  - frequency_score: int8
  - monetary_score: int8
  - monetary_avg_order: float32
  - avg_items_per_order: float32
  - frequency_last_30d: int16
  - frequency_last_90d: int16
  - days_between_orders: float32
  - coupon_usage_rate: float32 # 0~1
  - days_since_last_session: int16
  - cart_additions_last_30d: int16
optional:
  - num_interests: int16
target:
  - churn: int8 # (학습 시만 사용, 추론시 없음 가능)
