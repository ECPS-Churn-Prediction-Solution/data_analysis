# =====================================================================
# LightGBM training configuration + evaluation/threshold policy
# =====================================================================

meta:
  model_name: lgbm
  version_rule: "lgbm_v{date:%Y%m%d}_{gitsha7}"
  feature_version_rule: "fe_{date:%Y%m%d%H%M}_{hash8}"

artifacts:
  local_dir: "model_output"
  s3:
    enabled: false
    bucket: ""
    prefix: "ecps-churn/models/"

dataset:
  target: churn                # training label column name
  features_from_config: true   # read from features.yaml

training:
  random_state: 42
  n_jobs: -1
  params:
    boosting_type: gbdt
    n_estimators: 800
    learning_rate: 0.03
    max_depth: -1
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    objective: binary
    metric: "auc"
  early_stopping:
    enabled: false             # use external valid split if desired
    rounds: 100

evaluation:
  metrics:
    - roc_auc
    - pr_auc
    - ks
    - brier
  threshold_tuning:
    criteria_priority: ["balanced_accuracy", "mcc", "accuracy"]  # try in order; log all
    sweep:
      start: 0.05
      stop: 0.95
      step: 0.005
  calibration:
    enabled: false             # set true if you run Platt/Isotonic post-calibration

postprocess:
  risk_band:
    config_path: "config/risk_cuts.json"
  percentile:
    scope: batch_global        # compute 0..100 percentile within the same scoring batch
    decimals: 2
  labels:
    make_predicted_label_mcc: false   # stored only if you create extra columns
    make_predicted_label_bal: false

time_fields:
  reference_dt_rule: "scored_at"                 # reference_dt := scored_at
  churn_threshold_rule: "reference_dt - horizon_days"
  data_cutoff_rule: "max_event_ts_or_reference"  # use max event ts; fallback to reference_dt

scoring_output:
  required_fields:
    - user_id
    - scored_at
    - model_name
    - model_version
    - feature_version
    - data_cutoff_at
    - reference_dt
    - churn_horizon_days
    - churn_threshold_dt
    - churn_probability_raw
    - risk_band
    - score_percentile
    - imputations_count
    - anomalies_count
    - pipeline_run_id
    - valid_from
    - valid_until
  optional_fields:
    - top1_feature
    - top1_shap
    - top2_feature
    - top2_shap
    - top3_feature
    - top3_shap
    - order_count
    - total_spend
    - avg_order_value
    - avg_days_between_orders
    - login_count
    - cart_count
    - recency_days
    - rfm_sum
    - age
    - gender
    - age_group
    - used_coupon
    - avg_cart_per_login
    - category_diversity
    - rfm_bucket
    - kmeans_cluster
    - action_code_suggested
